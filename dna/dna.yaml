# Holochain 0.7 DNA manifest (DnaManifestV0).
#
# `manifest_version` is "0", not "1". Holochain 0.6 collapsed the manifest
# lineage onto a single V0 schema, so the "1" this file used under 0.4 is
# no longer a recognised variant. The struct is `deny_unknown_fields`, so
# every rename below is a hard parse failure rather than a warning.
manifest_version: "0"
name: epistemic-dna
integrity:
  # `origin_time` is gone. It was a Kitsune-1 DHT-sharding parameter, and
  # Kitsune2 (which replaced the networking layer wholesale in 0.5) has no
  # equivalent. Leaving it here fails the parse outright — it is not simply
  # ignored. The 0.7 `IntegrityManifest` is exactly network_seed +
  # properties + zomes.
  network_seed: ~
  # THE PROTOCOL VERSION, and the reason it is here rather than on each entry.
  #
  # `properties` is inside the DNA hash (DnaModifiers says so in its own doc
  # comment), so this is a declaration the network cannot disagree with: there
  # is no peer that thinks it is running something else, because a peer that
  # did would be on a different hash and therefore a different network.
  #
  # It is not a compatibility mechanism. Nothing on this substrate is: every
  # edit to the integrity zome forks the network, additive changes included, so
  # a network always runs exactly one version and has nothing to negotiate with.
  # What this buys is that a fork becomes LEGIBLE — two DNA hashes differing
  # only by this number are provably a protocol change rather than two mystery
  # hashes. See SPEC.md §11.1 for the full account.
  #
  # The integrity zome hardcodes the same number as PROTOCOL_VERSION and
  # validation refuses every write if the two disagree, so this cannot drift
  # from the code that implements it. Bump BOTH, or neither. A coordinator-zome
  # change is not a protocol change and must not bump either.
  properties:
    protocol_version: 2
  zomes:
    - name: epistemic_integrity
      hash: ~
      # `bundled:` is now `path:` — same meaning (a location resolved
      # relative to this manifest file), new field name, across DNA, app
      # and web-app manifests alike.
      #
      # There is no Cargo workspace unifying dna/integrity and
      # dna/coordinator (see either crate's Cargo.toml for why — the two
      # crates must resolve hdi to one physical instance, which a loose
      # workspace broke in the past). Each crate therefore builds into its
      # OWN target/ directory, not a shared repo-root target/. This path is
      # relative to this file (dna/dna.yaml), so ./integrity/target/...
      # resolves to dna/integrity/target/... — dna.yaml's own directory
      # already IS dna/, so integrity/ is a direct child, not a sibling.
      path: ./integrity/target/wasm32-unknown-unknown/release/epistemic_integrity.wasm
      dependencies: ~
      # `dylib:` is gone from ZomeManifest in 0.7 and must be removed.
coordinator:
  zomes:
    - name: epistemic_coordinator
      hash: ~
      # See epistemic_integrity's path comment above for why this points
      # into dna/coordinator/target/ rather than a shared repo-root target/.
      path: ./coordinator/target/wasm32-unknown-unknown/release/epistemic_coordinator.wasm
      dependencies:
        - name: epistemic_integrity

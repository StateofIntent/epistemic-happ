[package]
name = "epistemic_coordinator"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned exactly and matched to epistemic_integrity's own hdi pin
# (=0.8.0) — see that crate's Cargo.toml comment for the failure this
# guards against. hdk 0.7.0 itself depends on `hdi = "=0.8.0"` exactly, so
# the two crates now unify on one physical hdi instance by construction
# rather than by our own care alone.
hdk = "=0.7.0"
serde = { version = "1.0", features = ["derive"] }
epistemic_integrity = { path = "../integrity" }
sha2 = "0.10"
hex = "0.4"

# [dev-dependencies] intentionally omit hdk's "mock" feature. Under hdk
# 0.4.4 this was forced: that release's own bundled
# `mockall::mock! { impl HdkT for HdkT { ... } }` block referenced methods
# (accept_countersigning_preflight_request, block_agent, schedule,
# get_agent_key_lineage, is_same_agent) that don't exist on the HdkT/HdiT
# traits the same hdk version resolves — E0407, a bug in the published
# crate rather than anything fixable from this Cargo.toml. Whether hdk
# 0.7.0 still has that defect has NOT been rechecked; do not read the
# paragraph above as evidence either way. It is left off for now because
# nothing here depends on it.
#
# What that did not block, and still does not: the crate links and runs
# natively without any mock backend, so src/lib.rs's pure-logic unit tests
# (`cargo test --lib`) execute for real. hdk's non-mock host bindings
# aren't unconditional extern "C" wasm imports that would fail to resolve.
# What the missing mock feature genuinely blocks is host-call-mocking
# tests specifically (a MockHdkT-based tests/bridge_integration.rs was
# attempted and had to be removed for this reason) — not test execution in
# general. Production `cargo build --target wasm32-unknown-unknown` never
# touches this dependency either way.

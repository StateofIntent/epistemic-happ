# Required to actually LINK either zome crate for the real deployment
# target (wasm32-unknown-unknown), not just type-check it.
#
# hdi/hdk declare Holochain's host functions (must_get_entry,
# must_get_agent_activity, hash, verify_signature, dna_info, etc. — the
# __hc__* symbols) as `extern "C"` functions with no body: on a native
# target these would be resolved against a shared library, but on wasm32
# they're meant to become WASM *import* entries, resolved at runtime by
# the conductor's wasmer host, not at link time. rust-lld's wasm driver
# (wasm-ld) does not do this by default — without --allow-undefined it
# treats every one of those as an unresolved-symbol link error instead.
#
# This was never caught by this project's own verification, because
# `cargo check` (what every "verified against a real build" note in
# README.md / Cargo.toml refers to) does NOT invoke the linker at all —
# only `cargo build`/`cargo build --release` does. `cargo check` passing
# is compile-time-only evidence; it says nothing about whether the crate
# actually links into a deployable .wasm. Confirmed directly: without
# this file, `cargo build --target wasm32-unknown-unknown --release`
# fails in dna/integrity with ~12 "undefined symbol: __hc__*" errors;
# with it, both zomes link cleanly and produce real .wasm binaries.
#
# Lives at the repo root (not per-crate) because Cargo walks upward from
# the invoking directory looking for .cargo/config.toml, so this one file
# covers both dna/integrity and dna/coordinator regardless of which is
# built from — matching how this repo already has no Cargo workspace
# unifying the two crates otherwise (see either crate's Cargo.toml).
# SECOND FLAG, added for Holochain 0.7: hdi 0.8.0 depends on getrandom
# 0.3 specifically for the wasm32-unknown-unknown target, and getrandom
# 0.3 refuses to compile for that target until the consumer picks a
# backend — "The wasm32-unknown-unknown targets are not supported by
# default". The backend to pick is NOT `wasm_js`, which would bind
# randomness to browser/JS APIs a wasmer host does not provide; it is
# `custom`, leaving the symbol to be resolved the same way the `__hc__*`
# host functions are.
#
# Both flags below are exactly what Holochain's own zome-wasm build
# passes (crates/test_utils/wasm/build.rs at the holochain-0.7.0 tag:
# `-C opt-level=z -C link-arg=--import-undefined
# --cfg getrandom_backend="custom"`), which is the strongest available
# evidence of what a 0.7 zome is meant to be built with — those are the
# wasms upstream's own conductor tests actually run.
#
# Note `--import-undefined` rather than the `--allow-undefined` this file
# used under 0.4. It is the more precise flag for the same job: it turns
# each undefined symbol into a real WASM *import* entry, which is exactly
# what the `__hc__*` host functions are supposed to become, rather than
# merely tolerating them at link time.
[target.wasm32-unknown-unknown]
rustflags = [
    "-C", "link-arg=--import-undefined",
    "--cfg", "getrandom_backend=\"custom\"",
]

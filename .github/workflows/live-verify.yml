# =============================================================================
# The four harnesses that need no conductor, run on every push and pull request.
#
# WHY ONLY FOUR. `scripts/live-verify/` holds around thirty harnesses and most
# of them drive a real `hc sandbox` conductor: they install a .happ, publish
# entries to a DHT, and spend a real SWO friction budget. Those are not being
# smuggled into CI here. They need a Holochain toolchain, a built WASM DNA and
# a clean conductor per run, and a green tick that quietly stopped covering
# them would be worse than no tick at all.
#
# The four below are the ones this directory's own README already marks as
# exempt: they drive the `notes/` service and the built UI bundle, hold no
# Holochain credentials, and by construction never touch a DHT. Together they
# take about a minute.
#
# WHAT THIS DOES NOT CLAIM. A green run here means the layer above the
# promotion gate is verified. It says nothing about the protocol below it —
# `notes-ui.mjs`, which covers the gate itself against a real conductor, still
# has to be run by a person on a machine with a sandbox, and this file is not
# evidence about it. That distinction is the whole reason the notes layer is a
# separate package.
#
# WHY IT EXISTS AT ALL. Every merge into this repository has so far been gated
# by somebody remembering to run these by hand. In one pull request a harness
# went unrun for the entire review on a mistaken claim that its prerequisites
# were unavailable, and that was caught by a follow-up question rather than by
# anything automatic. This is the automatic thing.
# =============================================================================

name: live-verify (no conductor)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first: these harnesses bind
# fixed ports, so two runs of the same job on one runner would collide.
concurrency:
  group: live-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-conductor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            notes/package-lock.json
            mobile-ui/package-lock.json

      # First, because it needs nothing installed and nothing built. A
      # specification that has drifted from the code is worth knowing about
      # before eight minutes of browsers, and this answers in milliseconds.
      - name: spec-drift — §10 lists the functions that exist, and §9 states the real surface count
        run: node scripts/check-spec-drift.mjs

      # Cheap, no conductor, and it belongs beside spec-drift: both exist
      # because a hand-stated number in README.md went stale with nothing
      # watching. All seven harness counts were wrong when first measured.
      - name: harness-counts — README states the number of checks each harness actually has
        run: node scripts/check-harness-counts.mjs

      # The fourth in this family, and the only one guarding something this
      # repository did to ITSELF rather than something that drifted. Splitting
      # `partition-rejoin` out of `network` (see network.yml's own header) made
      # a merge-blocking red advisory, and paid for it by writing ten setup
      # steps twice in one file. This is the check that keeps the two copies
      # the same, so the advisory job never builds a different hApp from the
      # one the required job verified.
      - name: workflow-setup-drift — network.yml's two jobs still share one setup
        run: node scripts/check-workflow-setup-drift.mjs

      # AND THE ONE THAT GUARDS A GREEN RATHER THAN A RED. Everything above
      # catches a claim that has gone stale. This catches four required checks
      # reporting success having run nothing: `ci-scope.mjs` lets a
      # documentation-only pull request skip `conductor`, `network`, `ui` and
      # `zomes`, and if it ever calls a diff documentation when it is not, an
      # unverified merge lands on `main` under a full row of green ticks.
      #
      # It belongs HERE, in the one workflow the gate does not touch, and that
      # placement is the whole design: a gated checker could be skipped by the
      # mistake it exists to find.
      - name: ci-scope — the docs-only gate cannot clear a diff that touches code
        run: node scripts/check-ci-scope.mjs

      # SEVENTH IN THE FAMILY, AND THE SECOND THAT GUARDS A GREEN RATHER THAN A
      # RED. `replay.mjs` reports "0 failed, 0 skipped" and a line reading
      # "N of N" for every type it is ASKED about — and its per-type loop
      # iterates the coverage lists, so a type absent from them is never looked
      # at and the green says nothing about its rules. Its orphan check fires
      # for a case naming a missing rule, which by construction cannot fire for
      # a rule naming no case.
      #
      # That is what happened at `protocol_version: 11`: settlement's three
      # entry types went into COVERED, its two link types did not go into
      # COVERED_LINKS, and ten assertable rules sat undemanded under a green
      # corpus for four days. This is the thing that would have said so, in
      # milliseconds, on the pull request that did it.
      - name: corpus-coverage — no type with rules is demanded by nothing
        run: node scripts/check-corpus-coverage.mjs

      # Newest in that family, and the only one that guards a harness's own
      # ASSERTION rather than a document, a count or a workflow. Added
      # 2026-10-22, after a measurement rather than a worry: `past-cone.mjs`
      # asserted `declared_version === 10` because 10 was the version its field
      # had cost, settlement bumped the network to 11 the next day, and the
      # conductor job went red for eleven hours across three runs on a field
      # that was entirely fine (first occurrence: run 39615975688).
      #
      # Nothing above could have caught it — they read the specification, the
      # check counts, the two zomes and this file. The only thing that runs a
      # harness is the conductor job, which needs a built hApp and nine
      # minutes, so the feedback arrived a day late and looked like a defect.
      # This answers in milliseconds, before anything is installed or built.
      - name: version-assertions — no harness pins the protocol version a bump will change
        run: node scripts/check-version-assertions.mjs

      # Newest of all (2026-10-26), and the only one that gates a CONVENTION
      # rather than a count, a document or a rule. Every time field in this
      # protocol is an app `u64` the caller fills, so no HDK type carries its
      # unit and nothing could enforce one — and measured, the code had drifted
      # into two: `get_agent_constitution` compares `expires_at` against
      # seconds while `get_foresight_record` compares `reveal_deadline` against
      # micros, and `Claim.timestamp` was being written in BOTH by four
      # functions of one zome. SPEC.md §5.23 now declares the unit per field
      # and this is what holds the code to it.
      #
      # The asymmetry is why it is worth a gate. A `timestamp` in the wrong
      # unit is a display defect, because nothing reads those fields (§5.22).
      # An EXPIRY in the wrong unit never fires, and `validate_constitution`
      # cannot catch it — its only rule is `expires_at > published_at`, true in
      # either unit. Invisible to validation and invisible to the reader is
      # exactly the combination this family of checkers exists for.
      - name: time-units — every time field in the unit SPEC §5.23 declares
        run: node scripts/check-time-units.mjs

      # Third in the same family, and for the same reason the two above exist:
      # `scripts/validation-corpus/corpus/inventory.json` is a committed
      # snapshot of every `ValidateCallbackResult::Invalid` site in
      # `dna/integrity/src/lib.rs`, and `replay.mjs` drives only the cases that
      # inventory lists. So a validation rule ADDED without regenerating it is
      # a rule the corpus will never assert, and one REMOVED leaves the corpus
      # asserting a message the zome can no longer produce — both silently, and
      # both looking exactly like a green run. This is the thing that notices.
      #
      # `enumerate.mjs` reads the zome as text: no conductor, no node_modules,
      # no WASM build, and its output is byte-stable, so the check is a
      # regenerate-and-diff and answers in milliseconds.
      #
      # IT FIRES ON LINE SHIFTS TOO, and that is intended rather than tolerated.
      # Each record carries the site's `line`, so an edit ANYWHERE above a site
      # moves it and reds this check even when no rule changed. That is not a
      # false positive: the inventory's whole job is to be a current description
      # of the file, `replay.mjs` reports failures by line, and the remedy is
      # one command. A check that ignored line moves would have to stop
      # recording them, which is the more useful half of the record.
      #
      # AND IT WATCHES THE COORDINATOR TOO, since 2026-10-17. `enumerate.mjs`
      # reads both zomes: the integrity zome for the sites, the coordinator for
      # whether an extern hands a rule's field to the caller or derives it. So a
      # COORDINATOR-only edit can legitimately move a site's class, and this
      # check already catches that because it regenerates and diffs rather than
      # watching one file's mtime. Nothing needed adding — but the step name and
      # the error below both said "the integrity zome", which would have sent
      # the next person to the wrong file.
      - name: inventory-drift — the validation corpus still matches both zomes
        run: |
          node scripts/validation-corpus/enumerate.mjs
          git diff --exit-code scripts/validation-corpus/corpus/inventory.json || {
            echo "::error::The inventory is stale. Either the integrity zome's Invalid sites moved, or the coordinator changed which fields an extern accepts rather than derives (that decides the honest/crafted/needs_extern class). The diff above is what moved. Run: node scripts/validation-corpus/enumerate.mjs && git add scripts/validation-corpus/corpus/inventory.json"
            exit 1
          }

      # MOVED BELOW inventory-drift ON 2026-10-19, and the order is now load
      # bearing rather than arbitrary. Since item 17 this check does two things:
      # it sweeps the entry structs itself, and it compares its own pairs
      # against the ones `enumerate.mjs` publishes in the inventory — two
      # independent derivations that must agree, because one parser agreeing
      # with itself proves nothing about a conclusion this specific. That
      # comparison is only meaningful against an inventory already known to be
      # CURRENT, which is what the step above establishes. Run first, a stale
      # inventory would red here as "the two disagree" when the real fault is
      # staleness, and send the next person to the wrong file.
      #
      # What it guards is a property of the TYPES rather than of a document.
      # `scripts/validation-corpus/` finding 8 found by probe that a `Claim`'s
      # bytes deserialise into `Mew`, so `AgentToMew`'s type check does not
      # separate the two. That was one payload on one link type; this sweeps
      # every pair of entry structs for the same overlap, and distinguishes a
      # pair a guard can REACH from one merely waiting for a future guard.
      # Item 17 accepted the known pair rather than changing the DNA hash, so
      # what must not happen silently is a NEW one — and it would arrive as an
      # innocent-looking field added to an entry struct.
      - name: entry-type-confusion — no entry type's bytes can be read as another's, beyond the known two
        run: node scripts/check-entry-type-confusion.mjs

      # `npm ci` rather than `npm install`, so a run verifies the dependency
      # set that is actually committed.
      - name: Install and build the notes service
        working-directory: notes
        run: |
          npm ci
          npm run build

      # Packing does not compile — the trap this repository records for the
      # zomes, in a different package. A stale dist/ means verifying the
      # previous version of the screen, so the build is never skipped.
      - name: Install and build the UI
        working-directory: mobile-ui
        run: |
          npm ci
          npm run build

      # The runner has no system Chromium; the harnesses fall back to
      # Playwright's own download when /usr/bin/chromium is absent.
      - name: Install Chromium for Playwright
        working-directory: mobile-ui
        run: npx playwright install --with-deps chromium

      # Run separately rather than in one loop so a failure names itself in
      # the job summary without anybody opening the log.
      - name: notes-layer — the rules, over real HTTP
        run: node scripts/live-verify/notes-layer.mjs

      - name: notes-live — two browsers, one room
        run: node scripts/live-verify/notes-live.mjs

      - name: notes-assistant — the AI in the room, and its ceilings
        run: node scripts/live-verify/notes-assistant.mjs

      - name: theme-pinning — the palette, under both OS preferences
        run: node scripts/live-verify/theme-pinning.mjs

      # >>> PACKAGE BUILD — byte-identical in conductor.yml and live-verify.yml;
      # scripts/check-workflow-setup-drift.mjs fails if they diverge.
      #
      # WHY IT IS IN TWO FILES. `conductor.yml` builds these because its
      # harnesses drive them. `live-verify.yml` builds them because
      # `check-packages.mjs` asks whether `npm publish` would produce a working
      # package, and that question needs the two packages installed and nothing
      # else — no conductor, no DHT, no browser. Putting the check where the
      # setup already existed would have made a 30-second answer wait twelve
      # minutes behind a conductor it does not use.
      #
      # WHAT DRIFT WOULD COST. `check-packages.mjs` runs `npm run build` itself,
      # so what these steps supply is the dependency tree and not the build. If
      # one copy installs the SDK differently from the other — the registry
      # copy on one side and this checkout on the other, which is exactly what
      # the assertion below is about — then the publishability check verifies a
      # package built against something other than what the harnesses ran, and
      # its green stops being evidence about this tree.
      - name: Build the agent SDK
        working-directory: agent-sdk
        run: |
          npm ci
          npm run build

      # `--no-save ../agent-sdk`, not a plain install, and the header says why:
      # the registry copy of this dependency now resolves, and is not this tree.
      # `npm ci` IS available here now, and the reason it was not is corrected
      # rather than quietly dropped. This said `npm ci` "would undo the line
      # below even if a lockfile existed", because it deletes node_modules and
      # installs exactly the lockfile. True — in the other order. Run BEFORE the
      # local install rather than after, the two compose exactly as wanted:
      # `npm ci` gives a reproducible tree from the committed lockfile, then
      # `--no-save` replaces the SDK in it with this checkout's, and the lockfile
      # is left byte-identical (tested, not assumed). So mcp-server gets the same
      # reproducibility as the other seven packages without giving up the
      # local-SDK guarantee the assertion below defends.
      - name: Build the MCP server, against THIS tree's SDK
        working-directory: mcp-server
        run: |
          npm ci
          npm install --no-save ../agent-sdk
          npm run build
          # The assertion the paragraph above is worried about. A registry copy
          # here is a real directory and a symlink is the local tree, so this
          # distinguishes them — and it fails now, loudly, rather than three
          # steps later as eight inscrutable reds inside the harness.
          test -L node_modules/@stateofintent/agent-sdk \
            || { echo "::error::@stateofintent/agent-sdk resolved to the registry, not this checkout — mcp-server.mjs would verify a package this PR cannot change"; exit 1; }
      # <<< PACKAGE BUILD <<<

      # ITEM 1.9, and it was filed because of what hid it rather than because
      # the check was missing. `check-packages.mjs` existed, passed, and ran in
      # NO workflow — the only thing between a broken `npm publish` and the
      # registry was somebody remembering. `scripts/live-verify/README.md`
      # introduced it as "not a live-verify harness, but run by the same
      # reflex", which was accurate when nothing ran automatically, and
      # introduced `check-harness-counts.mjs` the same way two paragraphs down
      # — and THAT one has been a step in this file for weeks. The sentence
      # went stale for one of its two examples while still reading correctly,
      # which is why nobody noticed the other.
      #
      # WHAT IT CATCHES, none of which is visible until somebody installs the
      # published package, by which time the version number is spent: `files`
      # missing so `src/` ships; `dist` listed but never built, so the tarball
      # is a package whose entry point does not exist; a `file:../thing`
      # dependency that resolves on one machine and nowhere else, which
      # `mcp-server` actually had; and a licence declared in the SPDX field and
      # absent from the tarball.
      #
      # NOT the same question as `published-packages.mjs` in conductor.yml,
      # which drives the tarball the REGISTRY is serving (item 1.8). This one
      # asks whether the local tree would publish something installable, which
      # is the question a release asks — and `v0.3.0` asked it four times.
      - name: packages — `npm publish` from this tree would produce a working package
        run: node scripts/check-packages.mjs

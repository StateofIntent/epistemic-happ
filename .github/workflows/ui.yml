# =============================================================================
# Twenty-seven browser harnesses, against a real conductor and a real DHT. This is
# the layer that had no automatic check at all. The counts further down this
# header are historical — they record what was measured when this workflow was
# written, at seventeen.
#
# ON EVERY PULL REQUEST THAT COULD CHANGE THE ANSWER, which since 2026-10-25 is
# not every pull request. The `scope` job below skips this one when the diff is
# documentation and nothing else — see `scripts/ci-scope.mjs` for why that is
# safe, why it is a conditional rather than a `paths:` filter, and what still
# runs regardless. A push to `main` always runs everything.
#
# WHAT WAS ACTUALLY IN THE WAY, since three files said these were excluded and
# none of them said this. `conductor.yml`, `scripts/live-verify/README.md` and
# the root README each recorded the same exclusion — "the other seventeen
# conductor-bound browser harnesses still hardcode `/usr/bin/chromium`" — and
# each was careful to add that they "wait their turn behind a check, not behind
# a preference". The hardcoded path was the whole of it. Every other cost was
# already paid by `conductor.yml`: the Holochain binaries are a download, the
# friction budget is free on a fresh VM, and `pack-webhapp.sh` already builds
# the UI bundle these drive, because packing the webhapp is what it is for.
#
# SO ONE LINE PER HARNESS CHANGED, AND IT MOVED TO A FILE OF ITS OWN.
# `notes-ui` resolved the browser when it entered `conductor.yml` — EPI_CHROMIUM,
# then the system path, then Playwright's download — and by then that same
# paragraph had been written out four times, once per harness that reached CI.
# Seventeen more copies is not a refactor anyone should have to read, so the
# resolution now lives in `scripts/live-verify/chromium.mjs` and all
# twenty-one import it. Every one of those twenty-one runs in CI as of this
# commit, which is the condition this directory's README sets for touching
# them: change the resolution in the harness you are adding, in the commit that
# adds it.
#
# WHY A SEPARATE WORKFLOW RATHER THAN SEVENTEEN MORE STEPS IN `conductor.yml`.
# Each
# workflow here answers one question, and its header says what a green tick
# means so that a tick is readable without opening it. `zomes.yml` answers "does
# it compile and do its units hold", `live-verify.yml` "does the layer above the
# promotion gate work", `conductor.yml` "does the protocol do what it says
# against a real DHT", `network.yml` "does an entry cross between peers". This
# one answers a different question from all four: DOES THE SCREEN TELL THE TRUTH
# ABOUT THE PROTOCOL UNDERNEATH IT. Folding it into `conductor.yml` would make
# one tick mean two things and a red one ambiguous — and would roughly triple
# the runtime of the job that currently gives the fastest protocol answer.
#
# WHAT RUNS, and it is the whole set rather than a tranche. Every conductor-
# bound browser harness in `scripts/live-verify/`, each preceded by
# `sandbox.sh clean && sandbox.sh start`, which is this repository's one hard
# rule and not a precaution: exact counts are the assertion in several of these,
# and `affordance-surfacing` spends the entire hourly critique budget on
# purpose. A runner is a fresh VM, so the rule that is a chore locally is free
# here.
#
# MEASURED, NOT ESTIMATED, on a development machine before this workflow
# existed: 247 seconds of harness time for the seventeen, from 9s
# (`hud-layer`, `membranes-ui`, `founding-ui`, `graph-ui`) to 36s
# (`layout-fits`, which drives six tabs at three widths). Conductor restarts add
# about six seconds each. All seventeen were run green locally TWICE — 247s
# against the tree as it stood, and 243s again after the Chromium change, with
# `notes-ui` and the three conductor-free harnesses added to the second pass
# because they were converted in the same commit. A red tick here is therefore
# evidence about the runner or about the change under review, not about a
# harness nobody had ever run.
#
# WHAT DELIBERATELY DOES NOT RUN:
#   - The four multi-node harnesses. They need `network.sh`, not `sandbox.sh`,
#     and belong to `network.yml`, which runs `real-gossip`; the reasons the
#     other three stay out are in that file's header, with measured costs.
#   - `notes-ui`, which is a browser harness against a real conductor and would
#     fit here perfectly. It stays in `conductor.yml` because it is the
#     promotion gate — the seam between the soft layer and the protocol — and
#     moving it would quietly reduce what that workflow's tick covers. It is
#     the one deliberate overlap in intent between these two files.
#
# THIS WORKFLOW FOUND A DEFECT IN THE SHARED TEST ENVIRONMENT, WHICH IS WHY
# `sandbox.sh` CHANGED ALONGSIDE IT. Seventeen conductor cycles per run is
# roughly twice what any previous job did, and it surfaced a stall that had been
# there all along: `hc sandbox generate` writes a conductor config pointing at a
# PUBLIC bootstrap service and an iroh canary relay, with
# `request_timeout_s: 60`, and a runner that could not reach them turned zome
# calls into sixty-second stalls — `Host("iroh connect timed out")` on
# `hud-layer` here, the bare client-side `Request timed out in 60000 ms:
# call_zome` on `neighborhood-ui` here, and the same on `domain-index` and
# `read-scope` in `conductor.yml`, a job green on `main` for days.
#
# `network.yml` stayed green throughout, on THREE conductors and real QUIC,
# because `scripts/network.sh` runs a `kitsune2-bootstrap-srv` of its own. So
# `sandbox.sh` now runs one too. The fix was NOT a longer timeout, which would
# have made the stall slower to notice rather than absent.
#
# WHAT A GREEN TICK HERE MEANS, precisely. A real Chromium loaded the production
# bundle — `vite preview` over `dist/`, not the dev server — pointed it at a
# real conductor, and the screen rendered what the DHT actually holds. It is
# still one conductor on one machine: it says nothing about gossip, partition or
# convergence, and nothing about whether the published packages on npm work.
# What it does say is that the invariants these harnesses were written to
# enforce are enforced on screen — no node drawn bigger than another, no lens on
# by default, no chain-local read presented as global, no score beside a person
# — rather than enforced in a document about the screen.
# =============================================================================

name: ui (real browser, real DHT)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The sandbox binds fixed ports (8888/8889, matching bridge/.env.example), so
# two runs on one ref must not overlap. `conductor.yml` binds the same ports and
# is a separate group deliberately: the two jobs get separate runners, so they
# never share a port, and serialising them would double the wall clock for no
# reason.
concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # >>> SCOPE GATE — byte-identical in conductor.yml, network.yml, ui.yml and
  # zomes.yml; scripts/check-workflow-setup-drift.mjs fails if they diverge,
  # and scripts/check-ci-scope.mjs gates the classifier they share. Both of
  # those run in live-verify.yml, which carries NO gate of its own: every
  # checker that reads a document lives there, so a documentation claim is
  # still gated by CI on every pull request. What is skipped below is the jobs
  # that read no prose.
  #
  # WHY THIS IS A JOB AND AN `if:` RATHER THAN THE `paths:` FILTER IT LOOKS
  # LIKE IT SHOULD BE. A job skipped by a conditional reports SUCCESS to branch
  # protection. A workflow skipped by a `paths:` filter creates no check run at
  # all, and a required context with no check run leaves the pull request on
  # "Expected — waiting for status" forever. The documented remedy for that is
  # a stub workflow sharing the job name, and it is unsound here — see
  # scripts/ci-scope.mjs, which explains why `paths` and `paths-ignore` are not
  # complements and what a mixed diff would do to a pair of same-named jobs.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4

      - name: Can this diff change what the jobs below measure?
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/ci-scope.mjs
  # <<< SCOPE GATE <<<

  ui:
    needs: scope
    # Skipped when scope says the diff is documentation. `!cancelled()` is load
    # bearing: a failed `needs` skips its dependents, and a skipped job reports
    # SUCCESS to branch protection — so without it an error in `scope` would
    # satisfy this required check having run nothing. With it, the `if:` is
    # evaluated anyway, the output is empty, and the job runs.
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Which compiler this run used
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustc --version

      - name: Cache the cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('dna/integrity/Cargo.lock', 'dna/coordinator/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # `sandbox.sh` now runs its OWN bootstrap/relay service rather than
      # reaching for the public one `hc sandbox` defaults to — see that script's
      # header. This is the same binary, the same version and the same cache key
      # `network.yml` already uses, so on a runner that has built it once the
      # step below is a cache restore rather than a two-and-a-half-minute build.
      - name: Cache the kitsune2 bootstrap server
        id: k2cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/kitsune2-bootstrap-srv
          key: kitsune2-bootstrap-srv-0.5.1-${{ runner.os }}

      - name: Build the bootstrap server and iroh relay
        if: steps.k2cache.outputs.cache-hit != 'true'
        run: cargo install kitsune2_bootstrap_srv --version 0.5.1 --locked

      - name: Prove it is there, cached or freshly built
        run: |
          test -x ~/.cargo/bin/kitsune2-bootstrap-srv \
            || { echo "::error::kitsune2-bootstrap-srv is missing — sandbox.sh resolves it from PATH or ~/.cargo/bin and would fail later"; exit 1; }
          ~/.cargo/bin/kitsune2-bootstrap-srv --help >/dev/null

      # Into ~/.cargo/bin, reproducing the development machine's layout exactly,
      # so `pack-webhapp.sh` and `sandbox.sh` find them with no change to either
      # script. Pinned to the release tag and asserted on the downloaded binary
      # itself: a conductor that silently moved to 0.7.1 would produce results
      # about a version nothing here builds against, and a renamed asset should
      # fail loudly at this step rather than as a confusing harness failure
      # twenty minutes on. The same script as conductor.yml and network.yml —
      # its header carries the download flakiness this job kept losing whole
      # runs to, and the bound on the retry that answers it.
      - name: Install the Holochain 0.7.0 binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/install-holochain.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            mobile-ui/package-lock.json
            federation/package-lock.json

      # `scripts/live-verify/` has no dependencies of its own: it reaches
      # `@holochain/client` through a symlink into `federation/node_modules`,
      # which is gitignored and therefore absent from a fresh checkout.
      - name: Install the harnesses' one dependency
        run: |
          (cd federation && npm ci)
          ln -sfn ../../federation/node_modules scripts/live-verify/node_modules
          test -d scripts/live-verify/node_modules/@holochain/client \
            || { echo "::error::@holochain/client is not reachable from scripts/live-verify/"; exit 1; }

      # Playwright itself is resolved out of here by every harness below, and
      # `pack-webhapp.sh` builds this package as part of packing the webhapp.
      - name: Install the UI's dependencies
        working-directory: mobile-ui
        run: npm ci

      # The runner has no system Chromium, so every harness below falls through
      # to Playwright's own download — the third step in
      # `scripts/live-verify/chromium.mjs`. This is the step that makes that
      # fallback real rather than theoretical.
      - name: Install Chromium for Playwright
        working-directory: mobile-ui
        run: npx playwright install --with-deps chromium

      # NOT REGISTERED ANYWHERE UNTIL NOW, which is how 14 checks sat in the
      # repository for two days being run by nobody. It needs no conductor and
      # no browser — `src/applet.ts` imports nothing, which is the whole
      # reason it is a separate module from `applet-host.ts` — so it runs here,
      # before the five-minute pack, and a broken addressing rule fails the job
      # in seconds instead of twenty minutes.
      - name: applet rules — the WAL refusal, the surface mapping, and what a host may never gate
        working-directory: mobile-ui
        run: |
          npx esbuild src/applet.ts --format=esm --outfile=/tmp/applet.mjs
          node applet-prototype-check.mjs /tmp/applet.mjs

      # The repository's own documented build-and-pack path, driven unmodified.
      # It builds the zomes BEFORE packing, because `hc dna pack` compiles
      # nothing and packing first would wrap stale wasm in a fresh timestamp —
      # the trap once observed passing this entire suite with a deliberately
      # broken `get_claims_by_domain`. It also builds `mobile-ui`, which is not
      # incidental here: every harness below serves `dist/` through
      # `vite preview`, so a stale build would verify the previous UI and pass.
      - name: Build and pack the hApp
        run: scripts/pack-webhapp.sh

      # A clean conductor before EACH harness, not once before the batch. Run as
      # separate steps rather than a loop so a failure names itself in the job
      # summary, and so the timings above stay readable per harness.
      - name: hud-layer — discourse health, conductance and antibody flags, rendered from real state
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/hud-layer.mjs

      - name: membranes-ui — membranes, membership and governance
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/membranes-ui.mjs

      - name: founding-ui — domain founding, and that its accountability is real
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/founding-ui.mjs

      # Added 2026-10-27 for open-work 6.7, and it belongs beside founding
      # because the gap it covers was created by founding being the ONLY place
      # a `Constitution` could be published: a membrane may demand promises and
      # a joiner had nowhere to make them. It also guards the four phrases
      # `docs/the-joining-promise.md` asks for, byte for byte, since the
      # comparison they exist for is string equality.
      - name: promises-ui — promising without founding, and all of what you promise
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/promises-ui.mjs

      - name: graph-ui — the critique tree navigated spatially, with no node drawn bigger
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/graph-ui.mjs

      - name: onboarding-ui — progressive disclosure staging
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/onboarding-ui.mjs

      - name: evidence-retraction-ui — evidence, grounding, and author-only retraction
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/evidence-retraction-ui.mjs

      # This one spends the ENTIRE hourly critique budget on purpose — it has to,
      # since what it proves is that the form disappears exactly when the
      # protocol would refuse the write. Nothing may follow it on the same
      # conductor, which is what the clean step above is for.
      - name: affordance-surfacing — the critique form is gone exactly when the protocol would refuse it
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/affordance-surfacing.mjs

      - name: write-symmetry — the write halves of two read-only surfaces
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/write-symmetry.mjs

      - name: positions-ui — attributed positions on screen, and no tally beside them
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/positions-ui.mjs

      # open-work 1.23: the decision to KEEP the whole-DOM rebuild rests on one
      # claim, and this is the claim. It also found the defect it now gates —
      # focus on a button did not survive a rebuild, and the comment on
      # `captureFocus` asserted that it did.
      - name: render-invariant — the whole-DOM rebuild loses nothing the app owns
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/render-invariant.mjs

      # open-work 6.10. The model is STUBBED here on purpose — the spike
      # measures the model, this measures whether the client reads a reply
      # honestly, which is where every defect the spike found actually was.
      - name: compose-adversary — objections before the claim exists, and gone after
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/compose-adversary.mjs

      - name: taxonomy-ui — the critique vocabulary as a tree, writable, and never ranked
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/taxonomy-ui.mjs

      - name: trust-lenses — a lens is never on by default, always visible, and its effect legible
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/trust-lenses.mjs

      - name: expertise-ui — an expertise assertion is findable by strangers, and reads as self-asserted
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/expertise-ui.mjs

      - name: mode-and-constitution — a chain-local read is never shown as global, and absence is never scored
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/mode-and-constitution.mjs

      - name: worldline-ui — the approximate HRR probe never displaces the exact period record
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/worldline-ui.mjs

      - name: neighborhood-ui — the neighborhood probe is offered second, scored as approximate, and filters nothing
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/neighborhood-ui.mjs

      # The fake here is not a broken screen but a beautiful one: the revealed
      # predictions rendered accurately and the expired ones left out, which is
      # README.md §9's selective revelation rebuilt where no validation rule
      # reaches. The central check is that the expired group is there.
      - name: foresight-ui — the expired commitments render beside the revealed ones, and nothing is divided
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/foresight-ui.mjs

      # The fake this one has to defeat is a By Author tab that filters claims
      # the browser already holds — correct-looking, correctly scoped, and
      # leaving `get_claims_by_agent` as unsurfaced as it was.
      - name: author-scope-ui — one agent's record read from the DHT, not filtered client-side
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/author-scope-ui.mjs

      # Two fakes here, and neither is a broken screen. One sentence stood for
      # a domain nobody has written in, a read that never ran and a conductor
      # that is down, so a verification run had to load a known-populated
      # domain by hand to find out whether its own button worked. And the
      # "where you have been" list has the impostor author-scope-ui was built
      # against: assembled from what Browse already loaded, which looks right
      # the moment anybody uses it. Measured against the unfixed screen: 20 of
      # 31 red, and most of the eleven that stayed green assert a state is NOT
      # shown — which passes vacuously when the element never existed. The
      # first check is the one that catches that.
      - name: browse-states — an empty domain, a read in flight and a failure are three different answers
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/browse-states.mjs

      # The fake here is a count that is correct as soon as anybody uses the
      # screen normally: taken from the map the critique panel fills rather
      # than from the DHT. So the critiques are a second agent's and no panel
      # is ever opened. The other fake is quieter — an unread count rendered
      # as zero tells every author nobody disagreed with them, and corrects
      # itself before any sampled check could see it, so one assertion here
      # is against what the card was EVER displaying rather than what it
      # displays now.
      - name: own-critiques — an author learns somebody disagreed, and the number stays a fact
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/own-critiques.mjs

      # The same participant, the following day, on the panel above: "it
      # doesnt show if an author responded, who the other person is. Just
      # text." Three measured defects behind that sentence — a critique with
      # no byline, every line break in a permanent entry collapsed by CSS,
      # and a three-line box to compose one in — and each check here has a
      # flat control beside it, because "tall because a break survived" and
      # "tall because the screen is narrow" are the same measurement without
      # one. The fixture publishes the SAME WORDS twice, once with blank
      # lines and once with spaces, and the three critiques are written by
      # two agents in stranger-author-stranger order so that a byline taken
      # from whoever is logged in, and a thread grouped by person, both red.
      - name: reading-a-thread — who wrote this, and is it shaped the way they wrote it
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/reading-a-thread.mjs

      # The pilot walked into this one: an author retracted a claim because
      # somebody changed their mind, republished it narrower, and had nowhere
      # to attach the second to the first — the form passed
      # `replacement_claim: null` as a LITERAL, so the `RetractionToReplacement`
      # link type had no reachable producer at all. Both halves are under test
      # here, because a producer with no reader is the same defect wearing the
      # other shoe. §2 is the one to read if this ever goes red for a reason
      # that looks unrelated: it asserts the form's empty state, which depends
      # on the author's WHOLE SOURCE CHAIN being fresh, and its first check is
      # a control that says so rather than letting a dirty sandbox pass it
      # vacuously.
      - name: retraction-replacement — a retraction names what replaced it, and a reader can follow it
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/retraction-replacement.mjs

      - name: layout-fits — every tab at every width this UI is for, with an unbreakable token on screen
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/layout-fits.mjs

      # The OTHER host path, and it belongs beside the Launcher one because it
      # has the same shape of risk: a connection this UI is handed rather than
      # one it makes, and an Admin API it must never reach for. The fake Moss
      # host's `appletClient` bridges to a real conductor in the harness
      # process, so "a Tool render reaches real DHT data without touching
      # admin" is measured rather than reasoned about. It also holds the only
      # gate on a defect read out of the installed library: `WeaveClient.
      # connect()` never resolves when render info is absent, and an unguarded
      # await there is a permanently blank page with nothing in the console.
      - name: applet-view — this UI rendering as a Moss Tool, against a fake host and a real conductor
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/applet-view.mjs

      # The path an installed bundle actually takes, which is not the path
      # `vite preview` takes — this is the only check that the packed `.webhapp`
      # produced two steps above is something a launcher could serve.
      - name: launcher-packaging — the UI on the path an installed .webhapp actually takes
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/launcher-packaging.mjs

      # A harness failure and a conductor that never came up look identical from
      # the step's exit code, and they are diagnosed completely differently.
      - name: The conductor's own log, if anything failed
        if: failure()
        run: |
          scripts/sandbox.sh status || true
          echo "--- .hc_sandbox.log (last 200 lines) ---"
          tail -200 .hc_sandbox.log || echo "(no conductor log — it never started)"

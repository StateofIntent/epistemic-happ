# =============================================================================
# Four protocol harnesses, against a real conductor and a real DHT, on every
# push and pull request.
#
# WHY THIS WAS SAID TO BE IMPOSSIBLE, AND WHAT ACTUALLY CHANGED. Both existing
# workflows state that the conductor-bound harnesses stay out of CI because they
# "need a Holochain toolchain, a built WASM DNA and a clean conductor per run,
# and would spend real SWO friction budget to prove anything". That was an
# accurate description of the cost on a development machine. Two of the three
# objections turn out to be *cheaper* on a runner, not dearer, and the third was
# already paid:
#
#   - THE TOOLCHAIN IS A DOWNLOAD, not a build. holochain/holochain publishes
#     prebuilt x86_64-unknown-linux-gnu binaries with each release, and the
#     `holochain-0.7.0` tag carries both `hc` (9 MB) and `holochain` (54 MB) —
#     the exact versions this repository targets. Nothing is compiled to get
#     them. This was the assumption worth checking rather than inheriting.
#
#   - THE FRICTION BUDGET IS FREE HERE, which is the part that inverts. The one
#     hard rule in `scripts/live-verify/README.md` is a clean conductor per
#     harness, because `create_critique` and `create_synaptic_link` are capped
#     per rolling hour and a harness that spends the budget strands the next
#     one. On a development machine that rule is a chore and a documented source
#     of false failures. On a runner every job is a fresh VM, and every step
#     below runs `sandbox.sh clean && sandbox.sh start` first — so the budget is
#     fresh by construction. The constraint that makes these awkward locally
#     costs nothing here.
#
#   - THE WASM IS BUILT ANYWAY. `zomes.yml` already builds both zomes; this job
#     goes one step further and runs `scripts/pack-webhapp.sh`, the repository's
#     own documented build-and-pack path, which compiles the zomes *before*
#     packing precisely because `hc dna pack` compiles nothing and would
#     otherwise wrap stale code in a fresh timestamp.
#
# IT DRIVES THE REPOSITORY'S OWN SCRIPTS, deliberately, rather than
# reimplementing their steps inline. `pack-webhapp.sh` and `sandbox.sh` each
# carry a long header of constraints learned the expensive way — which flags are
# global, that `hc sandbox run` exits on its own, that packing does not compile.
# A workflow that open-coded those steps would drift from the documented path
# and verify something nobody actually runs. Both scripts already resolve `hc`
# and `holochain` from PATH or `~/.cargo/bin`, which is why the download step
# below installs into `~/.cargo/bin`: it reproduces the development machine's
# own layout exactly, and needs no change to either script.
#
# WHAT RUNS. Four harnesses that need nothing but `@holochain/client`:
# `domain-index` (the by-domain index and validation refusing three separate
# attempts to poison it), `read-scope` (two real agents — the harness that
# proved the most consequential defect this project has recorded),
# `mew-lifecycle` (the bridge's zome surface carrying a Mew to a Claim) and
# `friction-limits` (the SWO rolling-hour cap refusing a critique for real).
# Then `notes-ui` — the promotion gate itself, three real processes with a real
# browser the only thing touching all three, verifying what was published by an
# independent zome call rather than believing the screen. About 100 seconds
# together, plus conductor restarts.
#
# AND THREE MORE THAT ONLY EVER NEEDED A PACKAGE BUILT, which is the exclusion
# this revision deletes rather than restates. `agent-sdk` drives the SDK's own
# contract headlessly — an agent has no screen — including the friction budget
# to exhaustion, twenty critiques until the twenty-first is refused as a TYPED
# `FrictionLimitError`, because an agent loop's whole pacing strategy depends on
# telling "wait" apart from "something is broken". `mcp-server` drives the MCP
# server the way an agent actually reaches it: over stdio, as JSON-RPC, listing
# tools and pasting a hash from one call verbatim into the next. And
# `linked-data-gateway` spawns the gateway and holds it to the absence that
# defines it — no `aggregateRating`, no `upvoteCount`, nothing schema.org offers
# that would publish a canonical comparative score under this protocol's name.
# About ten seconds each including the conductor restart; the cost here is three
# `npm` installs, not the runs.
#
# THE SDK UNDER TEST MUST BE THIS TREE'S, AND A PLAIN `npm install` NO LONGER
# GIVES YOU THAT. `mcp-server` depends on `@stateofintent/agent-sdk` BY VERSION
# — the correct declaration for a published package, and `check-packages.mjs`
# fails if the `file:../agent-sdk` form ever comes back. That version is now on
# the registry, so `npm install` resolves cleanly, looks right, and installs a
# copy of the SDK that is not the one in this checkout. A pull request changing
# `agent-sdk/src` would then be verified against code it did not touch, and pass.
# So this job installs the local path with `--no-save`, exactly as
# `mcp-server/README.md` documents for development: the dependency is satisfied
# without rewriting the published declaration.
#
# THAT IS NOT A HYPOTHETICAL, AND THE DIFFERENCE IS CURRENTLY FATAL — watched,
# not reasoned. Built against the registry's 0.1.1, `mcp-server.mjs` goes RED on
# eight checks. The published SDK predates the `@holochain/client` 0.21 upgrade
# and still tests `CellType.Provisioned in cell` against what became a
# discriminated union: it matches nothing, collects no cell ids, authorizes no
# signing credentials, and every zome call afterwards fails. Rebuilt against the
# local path, the same harness is green. That is a real defect for anyone
# installing this package from npm today rather than a CI detail, so it is
# recorded in `mcp-server/README.md` and the root README — republishing is not
# something a workflow can do.
#
# ONE HARNESS HAD TO CHANGE, AND ONLY ONE. `notes-ui.mjs` hardcoded
# `/usr/bin/chromium`, as all eighteen conductor-bound browser harnesses do.
# #103 left them alone on the grounds that editing files it could not exercise
# would be churn asserting itself as safe — the right call then, and a reason
# that expires exactly here, since this job is a conductor on a machine with no
# system Chromium. So `notes-ui` now resolves EPI_CHROMIUM, then the system
# path, then Playwright's download, matching the three conductor-free harnesses
# — and the other seventeen keep the hardcoded path, unchanged, because the
# original argument still holds for every one of them that nothing yet
# exercises. They wait their turn behind a check, not behind a preference.
#
# WHAT DELIBERATELY DOES NOT RUN, and none of it is a wall:
#   - The other seventeen conductor-bound browser harnesses, per the paragraph
#     above.
#   - The four multi-node harnesses, which need `scripts/network.sh`: three
#     conductors, a bootstrap server and an iroh relay. Those binaries are
#     published on the same release tag, so this is scope rather than
#     impossibility — and `network-partition.mjs` additionally wants iptables in
#     a throwaway namespace, and `partition-rejoin.mjs` waits out a real gossip
#     backoff for about nine minutes.
#
# WHAT A GREEN TICK HERE MEANS, precisely. Real zome calls against a real DHT,
# with real validation running: this is the first CI in this repository that is
# evidence about the protocol itself rather than about the layer above it. It is
# still one conductor and one machine, so it says nothing about gossip,
# partition or convergence between peers — the harnesses that cover those are
# named above as not running yet.
# =============================================================================

name: conductor (real DHT)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The sandbox binds fixed ports (8888/8889, matching bridge/.env.example), so
# two runs on one ref must not overlap.
concurrency:
  group: conductor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conductor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Which compiler this run used
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustc --version

      - name: Cache the cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('dna/integrity/Cargo.lock', 'dna/coordinator/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Into ~/.cargo/bin so `pack-webhapp.sh` and `sandbox.sh` find them the
      # same way they do on a development machine — see the header.
      #
      # Pinned to the release tag rather than `latest`: this repository targets
      # 0.7.0 exactly, its zomes pin `hdk = "=0.7.0"`, and a conductor that
      # silently moved to 0.7.1 would produce results about a version nobody
      # here builds against. The assertion below is what makes the pin real
      # rather than decorative — a renamed or redirected asset fails here, loudly
      # and immediately, instead of surfacing as a confusing harness failure.
      - name: Install the Holochain 0.7.0 binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.cargo/bin
          for b in hc holochain; do
            gh release download holochain-0.7.0 -R holochain/holochain \
              -p "$b-x86_64-unknown-linux-gnu" -O ~/.cargo/bin/$b --clobber
            chmod +x ~/.cargo/bin/$b
          done
          hc --version
          holochain --version
          [ "$(hc --version)" = "holochain_cli 0.7.0" ] \
            || { echo "::error::hc is not 0.7.0"; exit 1; }
          [ "$(holochain --version)" = "holochain 0.7.0" ] \
            || { echo "::error::holochain is not 0.7.0"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            mobile-ui/package-lock.json
            federation/package-lock.json
            notes/package-lock.json

      # `scripts/live-verify/` has no dependencies of its own: it reaches
      # `@holochain/client` through a symlink into `federation/node_modules`,
      # which is gitignored and therefore absent from a fresh checkout. The
      # symlink is recreated here rather than committed, matching how the
      # working tree has it.
      - name: Install the harnesses' one dependency
        run: |
          (cd federation && npm ci)
          ln -sfn ../../federation/node_modules scripts/live-verify/node_modules
          # A dangling symlink would surface as an inscrutable import failure
          # inside the first harness, several minutes and one conductor later.
          test -d scripts/live-verify/node_modules/@holochain/client \
            || { echo "::error::@holochain/client is not reachable from scripts/live-verify/"; exit 1; }

      # `pack-webhapp.sh` builds the UI as part of packing the webhapp, so the
      # UI's own dependencies have to be present before it runs.
      - name: Install the UI's dependencies
        working-directory: mobile-ui
        run: npm ci

      # `notes-ui.mjs` drives three real processes, and the notes service is
      # one of them. Built, not just installed — the "packing does not compile"
      # trap in a different package.
      - name: Install and build the notes service
        working-directory: notes
        run: |
          npm ci
          npm run build

      # The runner has no system Chromium; `notes-ui.mjs` falls back to
      # Playwright's own download, exactly as the conductor-free browser
      # harnesses already do.
      - name: Install Chromium for Playwright
        working-directory: mobile-ui
        run: npx playwright install --with-deps chromium

      # Three harnesses need a package of this repository's own built first, and
      # that is all they ever needed. `tsc` only — no wasm, no browser — so this
      # is the cheapest coverage in the job by a wide margin.
      - name: Build the agent SDK
        working-directory: agent-sdk
        run: |
          npm ci
          npm run build

      # `--no-save ../agent-sdk`, not a plain install, and the header says why:
      # the registry copy of this dependency now resolves, and is not this tree.
      # `npm ci` is not available here — mcp-server ships no lockfile, which is
      # its own small gap and is recorded in mcp-server/README.md.
      - name: Build the MCP server, against THIS tree's SDK
        working-directory: mcp-server
        run: |
          npm install --no-save ../agent-sdk
          npm run build
          # The assertion the paragraph above is worried about. A registry copy
          # here is a real directory and a symlink is the local tree, so this
          # distinguishes them — and it fails now, loudly, rather than three
          # steps later as eight inscrutable reds inside the harness.
          test -L node_modules/@stateofintent/agent-sdk \
            || { echo "::error::@stateofintent/agent-sdk resolved to the registry, not this checkout — mcp-server.mjs would verify a package this PR cannot change"; exit 1; }

      - name: Build the linked-data gateway
        working-directory: gateway
        run: |
          npm ci
          npm run build

      # The documented path, run as documented: two cargo release builds, then
      # `hc dna pack`, `hc app pack`, the UI build, and `hc web-app pack`. This
      # step is therefore also the only automatic check that this script still
      # works.
      - name: Build and pack the hApp
        run: scripts/pack-webhapp.sh

      # A clean conductor before EACH harness, not once before the batch — the
      # one hard rule in scripts/live-verify/README.md. Run as four steps rather
      # than a loop so a failure names itself in the job summary.
      - name: domain-index — the by-domain index, and validation refusing to be poisoned
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/domain-index.mjs

      - name: read-scope — two real agents, and what each can see of the other
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/read-scope.mjs

      - name: mew-lifecycle — the bridge's zome surface, Mew through to Claim
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/mew-lifecycle.mjs

      - name: friction-limits — the rolling-hour cap refusing a critique for real
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/friction-limits.mjs

      # The gate itself, and the reason this whole workflow was worth building:
      # three real processes — the notes service, `vite preview` serving the
      # production bundle, and the conductor — with a real browser the only
      # thing touching all three, and the published entry read back by an
      # INDEPENDENT zome call rather than believed off the screen.
      - name: notes-ui — the promotion gate, in a real browser against a real DHT
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/notes-ui.mjs

      # The three that needed nothing but their own package built. No browser
      # and no packing involved — each talks to the conductor through the
      # surface an agent actually uses, and the same clean-conductor rule
      # applies. `agent-sdk` in particular spends the ENTIRE hourly critique
      # budget on purpose, so nothing may follow it on the same conductor.
      - name: agent-sdk — the SDK's contract, and the friction budget to exhaustion
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/agent-sdk.mjs

      - name: mcp-server — the MCP tool surface, over stdio as an agent drives it
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/mcp-server.mjs

      - name: linked-data-gateway — the one-way export, and the score it must not emit
        run: |
          scripts/sandbox.sh clean && scripts/sandbox.sh start
          node scripts/live-verify/linked-data-gateway.mjs

      # A harness failure and a conductor that never came up look identical from
      # the step's exit code, and they are diagnosed completely differently.
      - name: The conductor's own log, if anything failed
        if: failure()
        run: |
          scripts/sandbox.sh status || true
          echo "--- .hc_sandbox.log (last 200 lines) ---"
          tail -200 .hc_sandbox.log || echo "(no conductor log — it never started)"
